{% extends "base.html" %}
{% block title %}Ingresar | AUTOMATCH{% endblock %}
{% block content %}
<div class="form-page auth-page">
  <p class="eyebrow">BIENVENIDO DE NUEVO</p>
  <h1>Ingresar</h1>
  <p class="muted">Accedé a tu cuenta para ver los detalles y publicar vehículos.</p>
  <form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Correo electrónico *
      <input name="email" type="email" required autocomplete="email">
    </label>
    <label>Contraseña *
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <label>
      <input type="checkbox" name="remember_me" value="on" style="width: auto; margin-right: 8px;">
      Mantener mi sesión iniciada en este dispositivo
    </label>
    <button class="button" type="submit">Ingresar</button>
    <p class="tiny">¿Todavía no tenés cuenta? <a class="text-link" href="{{ url_for('register') }}">Registrate acá</a>.</p>
  </form>
</div>
{% endblock %}
