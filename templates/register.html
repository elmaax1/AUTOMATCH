
{% extends "base.html" %}
{% block title %}Crear cuenta | AUTOMATCH{% endblock %}
{% block content %}
<div class="form-page auth-page">
  <p class="eyebrow">SUMATE A AUTOMATCH</p>
  <h1>Crear cuenta</h1>
  <p class="muted">Registrate para publicar vehículos y consultar toda la información.</p>

  <form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Nombre y apellido *
      <input name="name" type="text" required maxlength="100" autocomplete="name">
    </label>

    <label>Correo electrónico *
      <input name="email" type="email" required maxlength="150" autocomplete="email">
    </label>

    <label>Número de teléfono *
      <input
        name="phone"
        type="tel"
        required
        maxlength="25"
        autocomplete="tel"
        inputmode="tel"
        placeholder="Ej.: +54 9 351 123 4567">
    </label>

    <label>Contraseña * (mínimo 8 caracteres)
      <input name="password" type="password" required minlength="8" autocomplete="new-password">
    </label>

    <label>Repetir contraseña *
      <input name="password_confirmation" type="password" required minlength="8" autocomplete="new-password">
    </label>

    <button class="button" type="submit">Crear mi cuenta</button>

    <p class="tiny">
      ¿Ya tenés una cuenta?
      <a class="text-link" href="{{ url_for('login') }}">Ingresá acá</a>.
    </p>
  </form>
</div>
{% endblock %}
